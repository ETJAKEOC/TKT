name: ShellCheck
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TKT
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck (error severity)
        run: |
          shellcheck --severity=error --shell=bash \
            install.sh \
            kconfigs/prepare \
            initramfs-and-grub-update.sh \
            CLEAN_BUILD.sh
